# The site lives only on https://www.albert-grabar.com (PlanetHoster).
# This workflow turns the old GitHub Pages address (https://grabar001.github.io/Portfolio/)
# into a redirect, so old links from a CV or LinkedIn still land on the real site.
# Settings → Pages → Source must be "GitHub Actions".
name: Redirect github.io to albert-grabar.com

on:
  push:
    branches: [main]
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write the redirect pages
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <title>Albert Grabar — albert-grabar.com</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://www.albert-grabar.com/">
          <meta http-equiv="refresh" content="0; url=https://www.albert-grabar.com/">
          </head>
          <body>
          <p>Le site a déménagé : <a href="https://www.albert-grabar.com/">www.albert-grabar.com</a></p>
          </body>
          </html>
          HTML
          cp redirect/index.html redirect/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

      - id: deployment
        uses: actions/deploy-pages@v4
