# Builds the site (npm run build) and publishes dist/ to GitHub Pages
# as a preview: https://grabar001.github.io/Portfolio/
# The real site lives on albert-grabar.com (PlanetHoster); the contact form only works there.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /Portfolio/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
