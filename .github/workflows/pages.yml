# Публикует сайт на GitHub Pages при каждом изменении ветки main.
# Перед публикацией заново собирает styles.css из styles.scss,
# так что достаточно править только styles.scss.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # ручной запуск со вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: |
          mkdir -p _site
          npx --yes sass@1.80.6 --no-source-map --style=compressed styles.scss _site/styles.css
          cp index.html scripts.js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
